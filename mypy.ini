[mypy]
# 忽略未安装的可选依赖 (cv2/ultralytics/torch/openvino/tensorrt/psutil)
ignore_missing_imports = True

# 遵循 PEP 484: 禁止隐式 Optional (param: str = None 须改为 str | None = None)
no_implicit_optional = True

# 允许未标注类型的函数 (项目中有大量 CLI 脚本函数)
disallow_untyped_defs = False
check_untyped_defs = False

# 关闭部分严格检查, 适合应用项目 (非库)
warn_return_any = False
warn_unused_ignores = True
warn_redundant_casts = True

# 排除测试目录和虚拟环境
exclude = (?x)(
    /tests/
    | /venv/
    | /.venv/
    | /env/
    | __pycache__
  )
