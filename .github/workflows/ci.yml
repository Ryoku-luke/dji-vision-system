# ============================================================
# DJI 运动相机视觉识别系统 - CI/CD 流水线配置
# ============================================================
# 本流水线包含三个作业:
#   1. syntax-check  : Python 语法检查 (py_compile)
#   2. unit-tests    : 单元测试与覆盖率统计 (pytest + pytest-cov), 跨平台矩阵
#   3. code-quality  : 代码质量检查 (pylint + mypy)
# ============================================================
name: CI

# ============================================================
# 触发条件: push 到 main 分支 + pull request 到 main 分支
# ============================================================
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一分支的新提交可以取消正在运行的旧流水线, 节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 作业 1: 语法检查 (syntax-check)
  # 对所有 .py 文件运行 python -m py_compile, 确保无语法错误
  # ============================================================
  syntax-check:
    name: 语法检查 (py_compile)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查所有 .py 文件
        run: |
          echo "正在对所有 .py 文件执行 py_compile 语法检查..."
          find . -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./env/*" \
            -not -path "*/__pycache__/*" \
            -print0 | xargs -0 -n1 python -m py_compile
          echo "语法检查全部通过."

  # ============================================================
  # 作业 2: 单元测试 (unit-tests)
  # 跨平台矩阵: Ubuntu / macOS / Windows
  # 阻塞式: 测试失败将阻止合并 (H-17)
  # ============================================================
  unit-tests:
    name: 单元测试 (pytest) - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行单元测试
        run: |
          if [ ! -d "tests" ]; then
            echo "tests 目录不存在, 跳过单元测试."
            exit 0
          fi
          echo "正在运行 pytest 单元测试..."
          pytest tests/ -v --cov=. --cov-report=xml
        shell: bash

      - name: 上传覆盖率报告
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  # ============================================================
  # 作业 3: 代码质量检查 (code-quality)
  # 阻塞式: 质量不达标将阻止合并 (H-17)
  # ============================================================
  code-quality:
    name: 代码质量检查 (pylint + mypy)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装代码质量工具
        run: pip install pylint mypy

      - name: 运行 pylint
        run: |
          echo "正在运行 pylint 代码质量检查 (评分阈值 6.0)..."
          find . -maxdepth 1 -name "*.py" -print0 | \
            xargs -0 pylint --fail-under=6.0

      - name: 运行 mypy
        run: |
          echo "正在运行 mypy 类型检查..."
          find . -maxdepth 1 -name "*.py" -print0 | \
            xargs -0 mypy
