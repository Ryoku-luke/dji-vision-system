# ============================================================
# DJI 运动相机视觉识别系统 - CI/CD 流水线配置
# ============================================================
# 本流水线包含三个作业:
#   1. syntax-check  : Python 语法检查 (py_compile)
#   2. unit-tests    : 单元测试与覆盖率统计 (pytest + pytest-cov)
#   3. code-quality  : 代码质量检查 (pylint + mypy)
# ============================================================
name: CI

# ============================================================
# 触发条件: push 到 main 分支 + pull request 到 main 分支
# ============================================================
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# 同一分支的新提交可以取消正在运行的旧流水线, 节省资源
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 作业 1: 语法检查 (syntax-check)
  # 对所有 .py 文件运行 python -m py_compile, 确保无语法错误
  # ============================================================
  syntax-check:
    name: 语法检查 (py_compile)
    runs-on: ubuntu-latest

    steps:
      # 步骤 1.1: 拉取代码仓库
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤 1.2: 安装 Python 3.11
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'             # 启用 pip 依赖缓存, 加速后续安装

      # 步骤 1.3: 安装项目依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤 1.4: 对所有 .py 文件运行语法检查
      # 排除虚拟环境目录 (venv / .venv) 与隐藏目录, 避免误检第三方库
      - name: 语法检查所有 .py 文件
        run: |
          echo "正在对所有 .py 文件执行 py_compile 语法检查..."
          # 查找所有 .py 文件, 排除虚拟环境目录
          find . -name "*.py" \
            -not -path "./venv/*" \
            -not -path "./.venv/*" \
            -not -path "./env/*" \
            -not -path "*/__pycache__/*" \
            -print0 | xargs -0 -n1 python -m py_compile
          echo "语法检查全部通过."

  # ============================================================
  # 作业 2: 单元测试 (unit-tests)
  # 运行 pytest 并统计覆盖率, 初始阶段允许失败不阻塞流水线
  # ============================================================
  unit-tests:
    name: 单元测试 (pytest)
    runs-on: ubuntu-latest
    # 当前为初始阶段, 允许本作业失败而不阻塞整体流水线
    continue-on-error: true

    steps:
      # 步骤 2.1: 拉取代码仓库
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤 2.2: 安装 Python 3.11
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 步骤 2.3: 安装项目依赖 (包含 pytest 与 pytest-cov)
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤 2.4: 运行单元测试并生成覆盖率报告
      # 若 tests 目录不存在则跳过; 若 pytest 失败不阻塞 (continue-on-error)
      - name: 运行单元测试
        continue-on-error: true
        run: |
          if [ ! -d "tests" ]; then
            echo "tests 目录不存在, 跳过单元测试."
            exit 0
          fi
          echo "正在运行 pytest 单元测试..."
          pytest tests/ -v --cov=. --cov-report=xml

      # 步骤 2.5: 上传覆盖率报告产物 (即使测试失败也尝试上传)
      - name: 上传覆盖率报告
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  # ============================================================
  # 作业 3: 代码质量检查 (code-quality)
  # 运行 pylint (评分阈值 6.0) 与 mypy, 初始阶段允许失败
  # ============================================================
  code-quality:
    name: 代码质量检查 (pylint + mypy)
    runs-on: ubuntu-latest

    steps:
      # 步骤 3.1: 拉取代码仓库
      - name: 检出代码
        uses: actions/checkout@v4

      # 步骤 3.2: 安装 Python 3.11
      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 步骤 3.3: 安装项目依赖
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 步骤 3.4: 安装代码质量工具 (pylint + mypy)
      - name: 安装 pylint 和 mypy
        run: pip install pylint mypy

      # 步骤 3.5: 运行 pylint 代码静态分析
      # 评分阈值 6.0, 初始阶段允许失败不阻塞
      - name: 运行 pylint
        continue-on-error: true
        run: |
          echo "正在运行 pylint 代码质量检查 (评分阈值 6.0)..."
          # 针对项目根目录下的所有源码 .py 文件
          find . -maxdepth 1 -name "*.py" -print0 | \
            xargs -0 pylint --fail-under=6.0

      # 步骤 3.6: 运行 mypy 类型检查
      # 初始阶段允许失败不阻塞
      - name: 运行 mypy
        continue-on-error: true
        run: |
          echo "正在运行 mypy 类型检查..."
          # 针对项目根目录下的所有源码 .py 文件
          find . -maxdepth 1 -name "*.py" -print0 | \
            xargs -0 mypy
